<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16233F">
<title>日経TEST 用語カード</title>
<style>
:root{
  --navy:#16233F; --navy-deep:#101A30; --navy-line:#2B3A5C;
  --paper:#F6F3EC; --paper-edge:#E4DFD3;
  --ink:#22252C; --ink-soft:#6E6A61;
  --slate:#8A97B2; --brass:#C08A2E; --brass-lit:#E3B457;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--navy)}
body{
  background:var(--navy);color:#E8EBF2;
  font-family:var(--gothic);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
@supports(min-height:100dvh){body{min-height:100dvh}}

#app{
  max-width:520px;margin:0 auto;
  padding:calc(6px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
}

.bar{display:flex;align-items:center;gap:14px;padding:14px 0 12px}
.bar-count{margin-left:auto;font-size:13px;color:var(--slate);font-variant-numeric:tabular-nums}
.track{height:2px;background:var(--navy-line);border-radius:2px;overflow:hidden}
.track > i{display:block;height:100%;background:var(--brass);width:0;transition:width .3s ease}

button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;
  appearance:none;-webkit-appearance:none}
.btn{display:block;width:100%;padding:16px;border-radius:3px;background:var(--brass);
  color:#1A1408;font-weight:700;letter-spacing:.04em;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-quiet{background:none;border:1px solid var(--navy-line);color:#C9D1E2;font-weight:400}
.link{color:var(--slate);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px}
:focus-visible{outline:2px solid var(--brass-lit);outline-offset:3px}

.screen{display:none}
.screen.on{display:block}

.hero{padding:26px 0 22px;border-bottom:1px solid var(--navy-line)}
.hero h1{font-family:var(--mincho);font-size:15px;font-weight:400;color:var(--slate);letter-spacing:.2em;margin-bottom:18px}
.due{display:flex;align-items:baseline;gap:10px}
.due b{font-size:60px;font-weight:400;font-family:var(--mincho);line-height:.95;color:#fff;font-variant-numeric:tabular-nums}
.due span{font-size:14px;color:var(--slate)}
.due-note{margin-top:12px;font-size:13.5px;color:var(--slate);line-height:1.75}

.scope-head{display:flex;align-items:baseline;gap:10px;padding:20px 0 2px}
.scope-head b{font-size:13px;font-weight:400;color:#D6DCE9;letter-spacing:.05em}
.scope-head span{margin-left:auto;font-size:11.5px;color:var(--slate)}
.genres{padding:4px 0 18px}
.genre{display:flex;align-items:center;gap:11px;padding:10px 0;width:100%;text-align:left;
  opacity:.36;transition:opacity .15s}
.genre.on{opacity:1}
.box{width:16px;height:16px;flex:0 0 16px;border:1px solid var(--navy-line);border-radius:2px;position:relative}
.genre.on .box{background:var(--brass);border-color:var(--brass)}
.genre.on .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:8px;
  border:solid #1A1408;border-width:0 2px 2px 0;transform:rotate(42deg)}
.genre-name{font-size:13.5px;width:10.5em;flex:0 0 10.5em;color:#D6DCE9;line-height:1.4}
.genre-name i{display:block;font-style:normal;font-size:11px;color:var(--slate)}
.genre-track{flex:1 1 auto;height:5px;background:var(--navy-line);border-radius:3px;overflow:hidden}
.genre-track > i{display:block;height:100%;background:var(--brass);width:0}
.genre-num{font-size:11.5px;color:var(--slate);font-variant-numeric:tabular-nums;
  flex:0 0 3.8em;text-align:right}

.foot{display:flex;justify-content:center;gap:2px;padding-top:14px;flex-wrap:wrap}
.warn{margin:0 0 16px;padding:12px 14px;border-left:2px solid var(--brass);
  background:rgba(192,138,46,.09);font-size:13px;line-height:1.7;color:#DCD2BE}

/* ---- カード：3D反転をやめ、面の入れ替えで表現する ---- */
.stage{padding:14px 0 18px}
.card{
  background:var(--paper);color:var(--ink);border-radius:4px;
  box-shadow:0 14px 32px rgba(0,0,0,.32);
  padding:26px 22px;min-height:300px;
  display:flex;flex-direction:column;cursor:pointer;
}
.face{display:none;flex-direction:column;flex:1 1 auto}
.face.on{display:flex;animation:fade .22s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tag{font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em}
.term{font-family:var(--mincho);font-size:clamp(26px,7.2vw,38px);font-weight:600;
  line-height:1.34;letter-spacing:.02em;margin:auto 0;padding:18px 0}
.hint{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:auto}
.term-sm{font-family:var(--mincho);font-size:21px;font-weight:600;
  padding-bottom:11px;margin-bottom:14px;border-bottom:1px solid var(--paper-edge)}
.body{font-size:14.5px;line-height:1.85}
.memo{margin-top:13px;padding-top:12px;border-top:1px dotted var(--paper-edge);
  font-size:13px;line-height:1.8;color:var(--ink-soft)}

#ctrl{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));
  background:var(--navy);padding-top:8px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade{padding:16px 4px;border-radius:3px;border:1px solid var(--navy-line);
  font-size:14px;text-align:center;transition:background .15s}
.grade:active{background:rgba(255,255,255,.07)}
.grade[data-g="2"]{border-color:var(--brass);color:var(--brass-lit)}

.done{text-align:center;padding:90px 0 40px}
.done h2{font-family:var(--mincho);font-size:26px;font-weight:400;margin-bottom:8px}
.done p{font-size:14px;color:var(--slate);margin-bottom:26px}

.form{padding:14px 0 24px;display:flex;flex-direction:column;gap:17px}
label{display:block;font-size:12.5px;color:var(--slate);margin-bottom:7px;letter-spacing:.05em}
input,textarea,select{width:100%;padding:12px;background:var(--navy-deep);color:#EDF0F6;
  border:1px solid var(--navy-line);border-radius:3px;font-family:inherit;font-size:16px;
  appearance:none;-webkit-appearance:none}
textarea{min-height:105px;resize:vertical;line-height:1.7}
.saved{font-size:13px;color:var(--brass-lit);min-height:1.3em}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation:none !important}}
</style>
</head>
<body>
<div id="app">

  <section class="screen on" id="s-home">
    <div class="hero">
      <h1>日経TEST 用語カード</h1>
      <div class="due"><b id="dueN">0</b><span id="dueUnit">枚が今日の出題</span></div>
      <p class="due-note" id="dueNote"></p>
    </div>
    <div class="scope-head"><b>今週の範囲</b><span>タップで切り替え</span></div>
    <div class="genres" id="genres"></div>
    <div id="warnSlot"></div>
    <button class="btn" id="start">今日のカードを始める</button>
    <div class="foot">
      <button class="link" id="toAdd">カードを追加</button>
      <a class="link" href="plan.html">1か月の進め方</a>
      <button class="link" id="toReset">記録をリセット</button>
    </div>
  </section>

  <section class="screen" id="s-card">
    <div class="bar">
      <button class="link" id="quit" style="padding:0">やめる</button>
      <span class="bar-count" id="pos">0 / 0</span>
    </div>
    <div class="track"><i id="prog"></i></div>
    <div class="stage">
      <div class="card" id="card">
        <div class="face on" id="faceF">
          <span class="tag" id="tagF"></span>
          <div class="term" id="termF"></div>
          <div class="hint">カードをタップして答えを見る</div>
        </div>
        <div class="face" id="faceB">
          <div class="term-sm" id="termB"></div>
          <div class="body"><span id="descB"></span><div class="memo" id="memoB"></div></div>
        </div>
      </div>
    </div>
    <div id="ctrl"></div>
  </section>

  <section class="screen" id="s-done">
    <div class="done">
      <h2>今日の分は終わりです</h2>
      <p id="doneP"></p>
      <button class="btn btn-quiet" id="back">最初の画面に戻る</button>
    </div>
  </section>

  <section class="screen" id="s-add">
    <div class="bar"><button class="link" id="addBack" style="padding:0">戻る</button></div>
    <div class="form">
      <p style="font-size:13.5px;color:var(--slate);line-height:1.8">
        テキストを読んでいて「これは覚えたい」と思った用語を入れてください。自分で書いたカードが一番定着します。
      </p>
      <div><label for="fT">用語</label><input id="fT" placeholder="例：資本コスト経営"></div>
      <div><label for="fG">章</label><select id="fG"></select></div>
      <div><label for="fD">説明</label><textarea id="fD" placeholder="自分の言葉で短く"></textarea></div>
      <div><label for="fM">補足（任意）</label><input id="fM" placeholder="ひっかかりやすい点など"></div>
      <span class="saved" id="saved"></span>
      <button class="btn" id="fSave">カードを保存</button>
    </div>
  </section>

</div>

<script>
/* =========================================================
   日経TEST 用語カード v3
   iOS Safari 対応版。3D反転・最新構文・固定高さを排除。
   ========================================================= */
const CATS=[
 {n:"基礎①　マクロ",         s:"第1章　景気・物価・雇用"},
 {n:"基礎②　市場と指標",     s:"第1章　金利・為替・株価"},
 {n:"実践①　産業",           s:"第2章　自動車・半導体ほか"},
 {n:"実践②　実務常識",       s:"第2章　会計・法務・戦略"},
 {n:"視野の広さ",             s:"第3章　国際・脱炭素・AI"},
 {n:"考える力の型",           s:"第4・5章　最優先"},
 {n:"今年の3テーマ",          s:"株高・積極財政・関税"}
];

const DECK=[
/* ===== 0. 基礎① マクロ（第1章） ===== */
{id:"gdp",g:0,t:"名目GDP / 実質GDP",d:"一定期間に国内で生み出された付加価値の合計。名目はその時の価格のまま、実質は物価変動の影響を取り除いたもの。",m:"景気の実勢を見るのは実質。物価が上がると名目だけが膨らむ。"},
{id:"deflator",g:0,t:"GDPデフレーター",d:"名目GDPを実質GDPで割った値。国内で生産されたモノ・サービス全体の物価水準を示す。",m:"輸入物価を含まないため、CPIより「国内の物価」を素直に映す。"},
{id:"gap",g:0,t:"潜在成長率とGDPギャップ",d:"潜在成長率は、労働・資本・生産性を平常どおり使い切って達成できる成長率。実際の成長率との差がGDPギャップ（需給ギャップ）。",m:"ギャップがプラスなら需要超過で物価が上がりやすい。"},
{id:"cpi",g:0,t:"コアCPI / コアコアCPI",d:"消費者物価指数から、日本ではコアが生鮮食品を除いたもの、コアコアが生鮮食品とエネルギーを除いたもの。",m:"日銀が物価目標で主に見るのはコア。定義が国により違う点が問われやすい。"},
{id:"ppi",g:0,t:"企業物価指数と消費者物価指数",d:"企業物価指数は企業間で取引されるモノの価格、消費者物価指数は家計が買うモノ・サービスの価格を示す。",m:"企業物価が先に動き、遅れて消費者物価に転嫁される。"},
{id:"tankan",g:0,t:"日銀短観",d:"日本銀行が四半期ごとに企業へ行う調査。景況感を示す業況判断DIが代表的な指標。",m:"DIは「良い」と答えた割合から「悪い」を引いた値。ゼロが境目。"},
{id:"di",g:0,t:"景気動向指数",d:"複数の経済指標を統合した指数。先行・一致・遅行の3系列があり、景気の局面判断に使う。",m:"一致指数が景気の現状、先行指数が数か月先を示す。"},
{id:"jobs",g:0,t:"有効求人倍率",d:"公共職業安定所で、求職者1人あたり何件の求人があるかを示す比率。1倍超で人手不足を示す。",m:"完全失業率より景気に先行して動きやすい。"},
{id:"unemp",g:0,t:"完全失業率",d:"労働力人口に占める、働く意思と能力があるのに職に就いていない人の割合。",m:"求職活動をしていない人は労働力人口に入らない。"},
{id:"realwage",g:0,t:"実質賃金",d:"名目賃金を物価上昇分で割り引いた賃金。生活実感に近い指標。",m:"賃上げしても物価上昇が上回れば実質賃金は下がる。"},
{id:"ms",g:0,t:"マネーストックとマネタリーベース",d:"マネーストックは世の中に出回るお金の総量。マネタリーベースは中央銀行が直接供給するお金。",m:"両者は別物。緩和で後者を増やしても前者が増えるとは限らない。"},
{id:"ca",g:0,t:"経常収支 / 貿易収支",d:"経常収支は貿易・サービス、第一次所得（海外投資の利子配当）などの合計。貿易収支はモノの輸出入の差額。",m:"日本は貿易赤字でも所得収支の黒字で経常黒字になりやすい。"},
{id:"pb",g:0,t:"プライマリーバランス",d:"国債の元利払いを除いた歳出を、税収などの歳入でどれだけ賄えているかを示す収支。",m:"財政健全化目標の基準として長く使われてきた。"},

/* ===== 1. 基礎② 市場と指標（第1章） ===== */
{id:"policy",g:1,t:"政策金利",d:"中央銀行が金融政策の操作目標とする短期金利。引き上げは金融引き締め、引き下げは緩和を意味する。",m:"日本では無担保コールレート翌日物が対象。"},
{id:"longrate",g:1,t:"長期金利",d:"一般に10年物国債の利回りを指す。住宅ローンや企業の長期借入の金利の目安になる。",m:"政策金利と違い、市場の需給と将来の物価見通しで決まる。"},
{id:"bondprice",g:1,t:"債券価格と金利の関係",d:"債券価格が上がると利回りは下がり、価格が下がると利回りは上がる。両者は必ず逆に動く。",m:"「国債が売られた」＝価格下落＝金利上昇。ニュースの読み替えができるように。"},
{id:"yield",g:1,t:"イールドカーブ / 逆イールド",d:"残存期間と利回りを結んだ曲線。長短が逆転して短期の方が高くなる状態が逆イールド。",m:"逆イールドは景気後退の予兆とされる。"},
{id:"qqe",g:1,t:"量的緩和 / YCC",d:"量的緩和は中央銀行が国債等を買い資金供給量を増やす政策。YCCは長短金利の水準そのものを操作する枠組み。",m:""},
{id:"normal",g:1,t:"金融正常化（金利ある世界）",d:"マイナス金利や大規模緩和といった非伝統的な政策を終え、金利機能が働く状態に戻すこと。",m:"預金金利・住宅ローン・企業の資金調達コストが同時に動く。"},
{id:"fx",g:1,t:"円安が企業に与える影響",d:"輸出企業は円換算の売上・利益が増えて追い風、輸入依存の企業や家計はコスト増で逆風になる。",m:"「円安＝日本経済に good」ではない。誰の立場かで答えが変わる典型問題。"},
{id:"ratediff",g:1,t:"為替を動かす内外金利差",d:"金利の高い通貨に資金が集まりやすいため、日米の金利差が開くと円安、縮まると円高に振れやすい。",m:"金融政策の変更が為替に直結する道筋がこれ。"},
{id:"reer",g:1,t:"実効為替レート",d:"対ドルだけでなく、貿易相手国の通貨全体に対する円の強さを加重平均した指標。",m:"対ドルで円高でも、実効ベースでは円安ということが起こる。"},
{id:"ppp",g:1,t:"購買力平価（PPP）",d:"同じ財を同じ価格で買えるように為替レートが決まるとする考え方。長期的な為替の目安とされる。",m:"ビッグマック指数はこれを単純化したもの。"},
{id:"nikkei",g:1,t:"日経平均株価 と TOPIX",d:"日経平均は225銘柄の株価を平均した指数。TOPIXは東証の広範な銘柄を時価総額で加重した指数。",m:"日経平均は値がさ株、TOPIXは大型株の影響を受けやすい。"},
{id:"mcap",g:1,t:"時価総額",d:"株価に発行済株式数を掛けた、企業の市場での評価額。",m:"株価の高さと企業規模は別。比較には時価総額を使う。"},
{id:"eps",g:1,t:"EPS（1株当たり利益）",d:"純利益を発行済株式数で割った値。PERの分母になる。",m:"自社株買いで株数が減ると、利益が同じでもEPSは上がる。"},
{id:"per",g:1,t:"PER（株価収益率）",d:"株価を1株当たり純利益で割った倍率。利益の何年分が株価に織り込まれているかを示す。",m:"高いほど期待が大きい、または割高。"},
{id:"pbr",g:1,t:"PBR（株価純資産倍率）",d:"株価を1株当たり純資産で割った倍率。1倍割れは時価総額が解散価値を下回る状態。",m:"1倍割れ企業への改善要請が近年の大きなテーマ。"},
{id:"roe",g:1,t:"ROE（自己資本利益率）",d:"純利益を自己資本で割った比率。株主が出したお金でどれだけ稼いだかを示す。",m:"借入を増やして自己資本を圧縮しても上がるため、単独では判断しない。"},
{id:"roic",g:1,t:"ROICと資本コスト",d:"ROICは税引後営業利益を、株主資本と有利子負債を合わせた投下資本で割った比率。資本コストは投資家が期待する最低限の収益率。",m:"ROICが資本コストを上回っているかが経営の合格ライン。"},
{id:"buyback",g:1,t:"自社株買い",d:"企業が自社の株式を市場から買い戻すこと。発行済株式数が減るため1株当たり利益が上がる。",m:"ROE改善と株主還元の両方の狙いがある。"},
{id:"payout",g:1,t:"配当性向 / 総還元性向",d:"配当性向は純利益のうち配当に回した割合。総還元性向は配当に自社株買いを加えた割合。",m:"株主還元の強化を測る際は総還元性向で見る。"},

/* ===== 2. 実践① 産業（第2章） ===== */
{id:"ev",g:2,t:"EV / HEV / PHEV",d:"EVは電気だけで走る車、HEVはエンジンとモーターを併用、PHEVは外部充電もできるハイブリッド。",m:"各国の政策転換で構成比の見通しが揺れている。"},

/* ---------- storage（Safariプライベートモードでも落ちないようにする） ---------- */
var store=(function(){
  var mem={},ok=true;
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}catch(e){ok=false;}
  return{
    ok:ok,
    get:function(k){
      try{ if(ok){return localStorage.getItem(k);} }catch(e){}
      return (mem[k]===undefined)?null:mem[k];
    },
    set:function(k,v){
      try{ if(ok){localStorage.setItem(k,v);return;} }catch(e){}
      mem[k]=v;
    }
  };
})();

var KEY="nt-cards-v2";
var INTERVAL=[0,1,2,4,7,14,30];
function today(){return Math.floor(Date.now()/864e5);}

var state;
try{ state=JSON.parse(store.get(KEY)); }catch(e){ state=null; }
if(!state||typeof state!=="object")state={};
if(!state.p)state.p={};
if(!state.custom)state.custom=[];
if(!Array.isArray(state.scope))state.scope=CATS.map(function(_,i){return i;});

function save(){ store.set(KEY,JSON.stringify(state)); }
function allCards(){ return DECK.concat(state.custom); }
function boxOf(id){ var p=state.p[id]; return (p&&p.box)||0; }
function $(id){ return document.getElementById(id); }
function show(id){
  var s=document.querySelectorAll(".screen");
  for(var i=0;i<s.length;i++){ s[i].classList.toggle("on", s[i].id===id); }
  window.scrollTo(0,0);
}

function dueCards(){
  var t=today();
  return allCards().filter(function(c){
    if(state.scope.indexOf(c.g)<0)return false;
    var p=state.p[c.id];
    return !p||p.due<=t;
  });
}

/* ---------- home ---------- */
function renderHome(){
  var due=dueCards(), all=allCards();
  var inScope=all.filter(function(c){return state.scope.indexOf(c.g)>=0;});
  var learned=inScope.filter(function(c){return boxOf(c.id)>=3;}).length;

  $("dueN").textContent=due.length;
  $("dueUnit").textContent=due.length?"枚が今日の出題":"枚";
  $("dueNote").textContent = due.length
    ? "選択中の範囲は"+inScope.length+"枚。うち"+learned+"枚が定着済み。1回およそ"+Math.min(20,due.length)+"枚、5分ほどで終わります。"
    : (inScope.length ? "今日の出題はありません。明日また開いてください。" : "範囲が選ばれていません。下から章を選んでください。");

  var html="";
  for(var i=0;i<CATS.length;i++){
    var cs=all.filter(function(x){return x.g===i;});
    var done=cs.filter(function(x){return boxOf(x.id)>=3;}).length;
    var pct=cs.length?Math.round(done/cs.length*100):0;
    var on=state.scope.indexOf(i)>=0;
    html+='<button class="genre'+(on?" on":"")+'" data-i="'+i+'" aria-pressed="'+(on?"true":"false")+'">'
      +'<span class="box"></span>'
      +'<span class="genre-name">'+CATS[i].n+'<i>'+CATS[i].s+'</i></span>'
      +'<span class="genre-track"><i style="width:'+pct+'%"></i></span>'
      +'<span class="genre-num">'+done+"/"+cs.length+'</span></button>';
  }
  $("genres").innerHTML=html;
  var btns=$("genres").querySelectorAll(".genre");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var i=parseInt(this.getAttribute("data-i"),10);
      var at=state.scope.indexOf(i);
      if(at>=0){ state.scope.splice(at,1); } else { state.scope.push(i); }
      save(); renderHome();
    });
  }

  $("warnSlot").innerHTML = store.ok ? "" :
    '<p class="warn">この環境では進捗が保存されません。ファイルを端末に保存してから開くと、記録が残ります。</p>';
  $("start").disabled = !due.length;
  $("start").style.opacity = due.length?1:.4;
}

/* ---------- session ---------- */
var queue=[], total=0, cur=null, flipped=false;

function startSession(){
  queue=dueCards().sort(function(){return Math.random()-.5;}).slice(0,20);
  total=queue.length;
  if(!total)return;
  show("s-card"); next();
}

function next(){
  if(!queue.length){
    var t=dueCards().length;
    $("doneP").textContent = t ? "残り"+t+"枚。続けても、明日に回しても構いません。"
                               : "選択中の範囲はすべてさらいました。";
    show("s-done"); renderHome(); return;
  }
  cur=queue[0]; flipped=false;
  $("faceF").classList.add("on");
  $("faceB").classList.remove("on");
  $("tagF").textContent=CATS[cur.g].n.replace(/\u3000+/," ");
  $("termF").textContent=cur.t;
  $("termB").textContent=cur.t;
  $("descB").textContent=cur.d;
  $("memoB").textContent=cur.m||"";
  $("memoB").style.display=cur.m?"block":"none";
  $("ctrl").innerHTML='<button class="btn" id="reveal">答えを見る</button>';
  $("reveal").addEventListener("click",function(e){e.stopPropagation();flip();});
  var done=total-queue.length;
  $("pos").textContent=(done+1)+" / "+total;
  $("prog").style.width=(done/total*100)+"%";
  window.scrollTo(0,0);
}

function flip(){
  if(flipped)return;
  flipped=true;
  $("faceF").classList.remove("on");
  $("faceB").classList.add("on");
  $("ctrl").innerHTML='<div class="grades">'
    +'<button class="grade" data-g="0">わからない</button>'
    +'<button class="grade" data-g="1">あいまい</button>'
    +'<button class="grade" data-g="2">わかる</button></div>';
  var gs=$("ctrl").querySelectorAll(".grade");
  for(var i=0;i<gs.length;i++){
    gs[i].addEventListener("click",function(e){
      e.stopPropagation();
      grade(parseInt(this.getAttribute("data-g"),10));
    });
  }
}

function grade(g){
  var p=state.p[cur.id]||{box:0,due:0};
  queue.shift();
  if(g===2){
    p.box=Math.min(p.box+1,INTERVAL.length-1);
    p.due=today()+INTERVAL[p.box];
  }else if(g===1){
    p.box=Math.max(p.box-1,0); p.due=today();
    queue.splice(Math.min(queue.length,6),0,cur);
  }else{
    p.box=0; p.due=today();
    queue.splice(Math.min(queue.length,3),0,cur);
  }
  state.p[cur.id]=p; save(); next();
}

/* ---------- add ---------- */
(function(){
  var o="";
  for(var i=0;i<CATS.length;i++){ o+='<option value="'+i+'">'+CATS[i].n.replace(/\u3000+/," ")+"</option>"; }
  $("fG").innerHTML=o;
})();
$("fSave").addEventListener("click",function(){
  var t=$("fT").value.replace(/^\s+|\s+$/g,""), d=$("fD").value.replace(/^\s+|\s+$/g,"");
  if(!t||!d){ $("saved").textContent="用語と説明の両方を入れてください。"; return; }
  state.custom.push({id:"u"+Date.now(), g:parseInt($("fG").value,10), t:t, d:d,
    m:$("fM").value.replace(/^\s+|\s+$/g,"")});
  save();
  $("fT").value=""; $("fD").value=""; $("fM").value="";
  $("saved").textContent="「"+t+"」を追加しました。次の出題から入ります。";
  renderHome();
});

/* ---------- wiring ---------- */
$("card").addEventListener("click",flip);
$("start").addEventListener("click",startSession);
$("quit").addEventListener("click",function(){renderHome();show("s-home");});
$("back").addEventListener("click",function(){renderHome();show("s-home");});
$("toAdd").addEventListener("click",function(){$("saved").textContent="";show("s-add");});
$("addBack").addEventListener("click",function(){show("s-home");});
$("toReset").addEventListener("click",function(){
  if(confirm("学習の記録と追加したカードをすべて消します。よろしいですか。")){
    state={p:{},custom:[],scope:CATS.map(function(_,i){return i;})};
    save(); renderHome();
  }
});
document.addEventListener("keydown",function(e){
  if(!$("s-card").classList.contains("on"))return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  if(flipped&&(e.key==="1"||e.key==="2"||e.key==="3")) grade(parseInt(e.key,10)-1);
});

renderHome();
</script>
</body>
</html>
